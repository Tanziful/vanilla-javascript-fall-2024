<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-purple-90 text-white min-h-screen flex items-center justify-center p-6">

    <div class="bg-purple-900 p-10 rounded-2xl shadow-lg w-full max-w-xl space-y-6 animate-fade-in">
        <h1 class="text-4xl font-extrabold text-center text-purple-200">Grade Calculator</h1>

        <div class="flex flex-col space-y-4">
            <input id="score" type="number" placeholder="Enter your score"
                class="p-3 rounded-lg text-black font-medium focus:outline-none focus:ring-2 focus:ring-purple-400" />

            <div class="flex gap-4 justify-center">
                <button id="calculateGrade"
                    class="bg-purple-500 hover:bg-purple-600 px-4 py-2 rounded-lg font-semibold text-white transition">
                    Calculate Grade
                </button>

                <button id="reset"
                    class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-semibold text-white transition">
                    Reset
                </button>
            </div>
        </div>

        <div id="resultArea" class="text-center text-2xl font-bold mt-4">
            Grade: <span id="result" class="text-purple-300"></span>
        </div>
    </div>

    <script src="script.js"></script>

    <style>
        .animate-fade-in {
            animation: fadeIn 0.7s ease-in-out both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</body>

</html>
